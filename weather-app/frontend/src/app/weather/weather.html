<main class="page">
  <h1>Hava durumu</h1>

  <div class="search">
    <input
      #cityInput
      type="text"
      placeholder="Şehir adı yaz"
      aria-label="Şehir adı"
      (keyup.enter)="search(cityInput.value)"
    />
    <button type="button" (click)="search(cityInput.value)">Ara</button>
  </div>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  @if (weather(); as w) {
    <section class="report">
      <h2 class="city">{{ w.city }}</h2>
      <p class="description">{{ w.description }}</p>
      <p class="temp">{{ w.temperature }}<small>°C</small></p>

      <div class="humidity">
        <p class="humidity-text">Nem <strong>%{{ w.humidity }}</strong></p>
        <div
          class="meter"
          role="meter"
          aria-label="Nem oranı"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-valuenow]="w.humidity"
        >
          <div class="meter-fill" [style.width.%]="w.humidity"></div>
        </div>
      </div>
    </section>
  }
</main>
